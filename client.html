<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お写真のお届け — mate wo mate</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FFF8F3;--surface:#FFF;--border:#EDE0D4;
    --accent:#B08A5E;--al:#F5EBE0;--ad:#8A6A40;
    --text:#2C2215;--muted:#8A7A6A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(44,34,21,.06)}
  .logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--ad)}
  .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  .hero{background:linear-gradient(135deg,#FFF8F3 0%,#F5EBE0 50%,#EDD8C0 100%);padding:56px 32px 48px;text-align:center;border-bottom:1px solid var(--border)}
  .hero-sub{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
  .hero-title{font-size:clamp(22px,5vw,36px);font-weight:700;margin-bottom:8px}
  .hero-info{font-size:15px;color:var(--muted);margin-bottom:20px}
  .hero-msg{background:#fff;border-radius:12px;padding:16px 24px;max-width:480px;margin:0 auto 24px;font-size:14px;line-height:1.7;border:1px solid var(--border);text-align:left;white-space:pre-line}
  .exp-banner{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:40px;padding:8px 20px;font-size:14px;font-weight:600}
  .exp-banner.soon{border-color:#f0c050;background:#FFFDE7;color:#7A5C00}
  .exp-dot{width:8px;height:8px;border-radius:50%;background:#27AE60}
  .exp-banner.soon .exp-dot{background:#f0c050}
  .dl-tips{background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:12px;padding:14px 20px;max-width:520px;margin:20px auto 0;text-align:left}
  .dl-tips-title{font-size:13px;font-weight:700;color:var(--ad);margin-bottom:10px;letter-spacing:.04em}
  .dl-tips-body{display:flex;flex-direction:column;gap:8px}
  .dl-tip-row{display:flex;gap:10px;font-size:13px;color:var(--text);line-height:1.6}
  .dl-tip-icon{font-size:16px;flex-shrink:0;margin-top:1px}
  .dl-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .ph-total{font-size:14px;color:var(--muted)}.ph-total strong{color:var(--text)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--ad)}
  .btn-outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}.btn-outline:hover{background:var(--al)}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--al);color:var(--ad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .gallery-wrap{max-width:1200px;margin:0 auto;padding:32px 24px}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

  /* 通常のphoto-card */
  .photo-card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--border);aspect-ratio:4/3;box-shadow:0 2px 8px rgba(44,34,21,.08);transition:transform .2s,box-shadow .2s,outline .15s}
  .photo-card:hover{transform:scale(1.02);box-shadow:0 6px 24px rgba(44,34,21,.18)}
  .photo-card img,.photo-card video{width:100%;height:100%;object-fit:cover;display:block}
  .photo-card video{pointer-events:none;background:#000}
  .video-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;pointer-events:none;z-index:2}
  .overlay{position:absolute;inset:0;background:rgba(44,34,21,0);display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;transition:background .2s}
  .photo-card:hover .overlay{background:rgba(44,34,21,.35)}
  .dl-btn{background:#fff;border:none;border-radius:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;font-size:15px}
  .photo-card:hover .dl-btn{opacity:1;transform:translateY(0)}

  /* 選択モード */
  .photo-card.selectable{cursor:pointer}
  .photo-card.selected{outline:3px solid var(--accent);outline-offset:-3px}
  .photo-card.selected .overlay{background:rgba(176,138,94,.25)}
  .check-circle{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .photo-card.selected .check-circle{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 選択バー */
  .select-bar{background:var(--al);border-bottom:1px solid var(--border);padding:10px 32px;display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .select-bar.show{display:flex}
  .select-count{font-size:14px;font-weight:600;color:var(--ad)}

  /* Skeleton */
  .skeleton{background:linear-gradient(90deg,#ede0d4 25%,#f5ebe0 50%,#ede0d4 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;aspect-ratio:4/3}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Lightbox */
  .lightbox{position:fixed;inset:0;background:rgba(20,12,6,.93);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .lightbox.open{opacity:1;pointer-events:all}
  .lb-inner{position:relative;display:flex;flex-direction:column;align-items:center;max-width:92vw}
  .lb-img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:8px;user-select:none}
  .lb-video{max-width:90vw;max-height:80vh;border-radius:8px;background:#000}
  .lb-bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .lb-counter{color:rgba(255,255,255,.7);font-size:14px;min-width:80px;text-align:center}
  .lb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:20px;display:flex;align-items:center;font-family:inherit;transition:background .15s}
  .lb-btn:hover{background:rgba(255,255,255,.25)}
  .lb-close{position:absolute;top:-44px;right:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
  .lb-close:hover{background:rgba(255,255,255,.3)}
  .lb-name{color:rgba(255,255,255,.45);font-size:12px;margin-top:8px}
  /* State page */
  .state-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px}
  .state-icon{font-size:64px;margin-bottom:20px}
  .state-title{font-size:22px;font-weight:700;margin-bottom:10px}
  .state-desc{font-size:15px;color:var(--muted);max-width:380px;line-height:1.7}
  /* iOS hint */
  .ios-hint{font-size:12px;color:rgba(255,255,255,.5);margin-top:8px;text-align:center}
  /* ZIP progress */
  .zip-prog{background:var(--al);border-radius:6px;padding:8px 14px;font-size:13px;color:var(--ad);display:none}
  .zip-prog.show{display:inline-block}
  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .25s;white-space:nowrap;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 次の写真ボタン */
  .next-share-btn{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;z-index:998;box-shadow:0 4px 20px rgba(44,34,21,.3);display:none;white-space:nowrap;font-family:inherit}
  .next-share-btn.show{display:block}
  @media(max-width:600px){
    .hero{padding:40px 20px 36px}
    .dl-bar{padding:10px 20px}
    .select-bar{padding:10px 20px}
    .gallery-wrap{padding:20px 16px}
    .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">📷</div>mate wo mate</div>
</header>

<div id="app"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-inner">
    <button class="lb-close" onclick="closeLB()">✕</button>
    <img class="lb-img" id="lbImg" src="" alt="" onerror="imgFallback(this)">
    <video class="lb-video" id="lbVideo" controls playsinline preload="metadata" style="display:none"></video>
    <div class="lb-bar">
      <button class="lb-btn" onclick="lbMove(-1)">&#8592;</button>
      <span class="lb-counter" id="lbCounter"></span>
      <button class="lb-btn" onclick="lbMove(1)">&#8594;</button>
      <button class="btn btn-primary" onclick="smartDownload(lbIdx)" style="font-size:13px;padding:8px 14px">⬇ 保存</button>
    </div>
    <div class="lb-name" id="lbName"></div>
    <div class="ios-hint" id="iosHint" style="display:none">「写真に追加」を選択してください</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="next-share-btn" id="nextShareBtn" onclick="shareNext()"></button>

<script>
// ════════════════════════════════════════════════════════════
// ▼ ここを書き換えてください（admin.htmlと同じ値を入れてください）
const SUPABASE_URL  = 'https://gfywkysbinveawgpcbpg.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmeXdreXNiaW52ZWF3Z3BjYnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MzExMDMsImV4cCI6MjA5NjIwNzEwM30.Ac6V6STbVne5THn61peXW2rxgEMJY_C_OTw7CkvRdbE';
const R2_PUBLIC_URL = 'https://gallery-photos-worker.htajp707.workers.dev';
// ════════════════════════════════════════════════════════════
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;

let _photos    = [];
let lbIdx      = 0;
let _quality   = 'compress'; // ギャラリーの画質設定
let _selectMode = false;
let _selected   = new Set();

// 順次シェア用
let _shareQueue = [];   // 保存待ちアイテム
let _shareIdx   = 0;    // 現在位置
let _shareBtn   = null; // 完了後にdisabled解除するボタン
let _shareBatch = 1;    // 1=1件ずつ / >1=まとめて
let _prepared   = null; // fetch済みFile配列（タップ時に即shareするため）

// ─── Helpers ─────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d)return''; const x=new Date(d); return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`; }
function getStatus(d){ const diff=Math.ceil((new Date(d)-Date.now())/86400000); return diff<0?'expired':diff<=7?'soon':'active'; }
function daysLeftText(d){
  const diff=Math.ceil((new Date(d)-Date.now())/86400000);
  if(diff<0) return `期限は${Math.abs(diff)}日前に終了しました`;
  if(diff===0)return '本日が最終日です';
  if(diff===1)return '明日が最終日です';
  return `あと ${diff} 日間ダウンロードできます`;
}
function statePage(icon,title,desc){ return `<div class="state-page"><div class="state-icon">${icon}</div><div class="state-title">${title}</div><div class="state-desc">${desc}</div></div>`; }
function isVideo(p){ return (p.content_type||'').startsWith('video/'); }
// storage_path "{galleryId}/{photoId}.jpg" → "{galleryId}/{dir}/{photoId}.jpg"
function variantPath(sp, dir){
  const i = sp.lastIndexOf('/');
  const dirPart = i < 0 ? '' : sp.slice(0, i+1);
  const file    = i < 0 ? sp : sp.slice(i+1);
  const stem    = file.replace(/\.[^/.]+$/, '');
  return `${dirPart}${dir}/${stem}.jpg`;
}
// サムネイル/中間版が無い既存ギャラリー向けフォールバック（原寸へ戻す）
function imgFallback(el){
  if (el.dataset.fellback) return;
  el.dataset.fellback = '1';
  if (el.dataset.full) el.src = el.dataset.full;
}
function extFromType(t){
  if(!t) return 'jpg';
  if(t.includes('quicktime')) return 'mov';
  const e=(t.split('/')[1]||'jpg').toLowerCase();
  return e==='jpeg'?'jpg':e;
}
function defaultName(p,i){ return p.file_name || `${isVideo(p)?'video':'photo'}_${i+1}.${extFromType(p.content_type)}`; }
async function fetchAsFile(p,i){
  const res = await fetch(p.publicUrl);
  if(!res.ok) throw new Error(`fetch failed: ${res.status}`);
  const blob = await res.blob();
  const type = p.content_type || blob.type || 'image/jpeg';
  return new File([blob], defaultName(p,i), {type});
}

// ─── Init ─────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(location.search);
  const id     = params.get('gallery');
  const app    = document.getElementById('app');

  if (!id) { app.innerHTML = statePage('🔗','URLが正しくありません','スタジオからお送りしたURLをそのままお開きください。'); return; }

  const {data:gallery,error:gErr} = await sb.from('galleries').select('*').eq('id',id).single();
  if (gErr||!gallery) { app.innerHTML = statePage('🔍','ギャラリーが見つかりません','URLが正しいかご確認ください。ご不明な点はスタジオまでお問い合わせください。'); return; }

  const status = getStatus(gallery.expires_at);
  if (status === 'expired') {
    app.innerHTML = statePage('⏰','ダウンロード期限が終了しました',`大変申し訳ございませんが、このギャラリーのダウンロード期限（${fmtDate(gallery.expires_at)}）が終了しました。ご希望の方はスタジオまでご相談ください。`);
    return;
  }

  _quality = gallery.quality || 'compress';
  document.title = `${gallery.client_name}様のお写真 — mate wo mate`;
  const bannerCls = status==='soon'?'exp-banner soon':'exp-banner';

  app.innerHTML = `
    <div class="hero">
      <div class="hero-sub">Your Gallery</div>
      <h1 class="hero-title">${esc(gallery.client_name)}様のお写真</h1>
      <div class="hero-info">${esc(gallery.shoot_type||'')}${gallery.shoot_date?' ｜ '+fmtDate(gallery.shoot_date)+'撮影':''}</div>
      ${gallery.message?`<div class="hero-msg">${esc(gallery.message)}</div>`:''}
      <div class="${bannerCls}"><span class="exp-dot"></span>${daysLeftText(gallery.expires_at)}（${fmtDate(gallery.expires_at)}まで）</div>
      ${gallery.quality !== 'original' ? `
      <div class="dl-tips">
        <div class="dl-tips-title">📥 写真の保存方法</div>
        <div class="dl-tips-body">
          <div class="dl-tip-row">
            <span class="dl-tip-icon">📱</span>
            <span><strong>スマートフォンの方</strong>「まとめてダウンロード」をタップ。読み込み完了後にシェアシートが開くので「写真に追加」を選択してください（開かない場合は画面下の<strong>「📲 タップして保存」ボタン</strong>を押してください）。動画がある場合は続けて1本ずつ保存できます。</span>
          </div>
          <div class="dl-tip-row">
            <span class="dl-tip-icon">💻</span>
            <span><strong>パソコンの方</strong>「まとめてダウンロード」でZIPファイルとして一括保存できます。</span>
          </div>
        </div>
      </div>` : `
      <div class="dl-tips">
        <div class="dl-tips-title">📥 写真の保存方法（フル画質）</div>
        <div class="dl-tips-body">
          <div class="dl-tip-row">
            <span class="dl-tip-icon">📱</span>
            <span><strong>スマートフォンの方</strong>「☑ 選択して保存」をお使いください。フル画質のため<strong>1枚ずつ保存</strong>します。「写真に追加」で保存後、画面下の<strong>「次を保存」ボタン</strong>をタップして次に進んでください。</span>
          </div>
          <div class="dl-tip-row">
            <span class="dl-tip-icon">💻</span>
            <span><strong>パソコンの方</strong>「☑ 選択して保存」で複数枚まとめてZIPダウンロードできます。</span>
          </div>
        </div>
      </div>`}
    </div>
    <div class="dl-bar" id="dlBar">
      <div class="ph-total">全 <strong id="totalCount">読込中…</strong></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="zip-prog" id="zipProg"></span>
        <button class="btn btn-ghost" id="selectBtn" onclick="toggleSelectMode()" disabled>☑ 選択して保存</button>
        ${gallery.quality !== 'original' ? `<button class="btn btn-outline" id="dlAllBtn" onclick="downloadAll()" disabled>⬇ まとめてダウンロード</button>` : ''}
      </div>
    </div>
    <div class="select-bar" id="selectBar">
      <div class="select-count" id="selectCount">0枚を選択中</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="toggleSelectAll()" id="selectAllBtn">全選択</button>
        <button class="btn btn-primary" id="saveSelBtn" onclick="saveSelected()" disabled>⬇ 選択した写真を保存</button>
        <button class="btn btn-ghost" onclick="toggleSelectMode()">キャンセル</button>
      </div>
    </div>
    <div class="gallery-wrap">
      <div class="gallery-grid" id="grid">
        ${Array(gallery.photo_count||12).fill('<div class="skeleton"></div>').join('')}
      </div>
    </div>`;

  const {data:photos} = await sb.from('photos').select('*').eq('gallery_id',id).order('sort_order');
  _photos = (photos||[]).map(p => ({
    ...p,
    publicUrl: `${R2_PUBLIC_URL}/${p.storage_path}`,                       // 原寸（ダウンロード用）
    thumbUrl : `${R2_PUBLIC_URL}/${variantPath(p.storage_path,'thumb')}`,  // 一覧用 600px
    webUrl   : `${R2_PUBLIC_URL}/${variantPath(p.storage_path,'web')}`     // 拡大用 1600px（originalギャラリーのみ）
  }));

  const _nVideo = _photos.filter(isVideo).length;
  document.getElementById('totalCount').textContent =
    _nVideo ? `写真${_photos.length-_nVideo}枚・動画${_nVideo}本` : `${_photos.length}枚`;

  const grid = document.getElementById('grid');
  if (!_photos.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">写真の準備中です。しばらくお待ちください。</div>';
    return;
  }

  renderGrid();

  const dlAllBtn = document.getElementById('dlAllBtn');
  const selectBtn = document.getElementById('selectBtn');
  if (dlAllBtn) {
    dlAllBtn.disabled = false;
    dlAllBtn.textContent = `⬇ まとめてダウンロード（全${_photos.length}枚）`;
  }
  selectBtn.disabled = false;
}

// ─── Grid render ─────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = _photos.map((p,i) => {
    const sel = _selected.has(i);
    return `
    <div class="photo-card${_selectMode?' selectable':''}${sel?' selected':''}" id="card-${i}" onclick="${_selectMode?`toggleSelect(${i})`:`openLB(${i})`}">
      ${isVideo(p)
        ? `<video src="${p.publicUrl}#t=0.1" muted playsinline preload="metadata"></video><div class="video-badge">▶ 動画</div>`
        : `<img src="${p.thumbUrl}" data-full="${p.publicUrl}" onerror="imgFallback(this)" alt="${esc(p.file_name||'')}" loading="lazy" decoding="async">`}
      <div class="overlay">
        ${_selectMode
          ? `<div class="check-circle" style="position:absolute;top:8px;left:8px">${sel?'✓':''}</div>`
          : `<button class="dl-btn" title="保存" onclick="event.stopPropagation();smartDownload(${i})">⬇</button>`}
      </div>
    </div>`;
  }).join('');
}

// ─── Select mode ─────────────────────────────────────────────
function toggleSelectMode() {
  _selectMode = !_selectMode;
  _selected.clear();
  const selectBar = document.getElementById('selectBar');
  const selectBtn = document.getElementById('selectBtn');
  if (_selectMode) {
    selectBar.classList.add('show');
    selectBtn.textContent = '✕ 選択を終了';
  } else {
    selectBar.classList.remove('show');
    selectBtn.textContent = '☑ 選択して保存';
  }
  updateSelectCount();
  renderGrid();
}

function toggleSelect(i) {
  if (_selected.has(i)) _selected.delete(i); else _selected.add(i);
  updateSelectCount();
  const card = document.getElementById(`card-${i}`);
  if (!card) return;
  card.classList.toggle('selected', _selected.has(i));
  const circle = card.querySelector('.check-circle');
  if (circle) circle.textContent = _selected.has(i) ? '✓' : '';
}

function toggleSelectAll() {
  const btn = document.getElementById('selectAllBtn');
  if (_selected.size === _photos.length) {
    _selected.clear();
    btn.textContent = '全選択';
  } else {
    _photos.forEach((_,i) => _selected.add(i));
    btn.textContent = '全解除';
  }
  updateSelectCount();
  renderGrid();
}

function updateSelectCount() {
  const n = _selected.size;
  const el = document.getElementById('selectCount');
  const btn = document.getElementById('saveSelBtn');
  const allBtn = document.getElementById('selectAllBtn');
  if (el) el.textContent = `${n}枚を選択中`;
  if (btn) btn.disabled = n === 0;
  if (allBtn) allBtn.textContent = (n === _photos.length && n > 0) ? '全解除' : '全選択';
}

// ─── iOS シェア（2段階方式） ──────────────────────────────────
// Web Share APIは「タップ直後」しか呼べないため、
// ①先にファイルをfetchして準備 → ②ボタンタップで即share() の順にする。
// 準備が速くタップ扱いが残っている場合はボタンなしで直接シェアシートが開く。

function shareLabel(n){
  const total = _shareQueue.length;
  if (total <= 1) return '';
  const end = Math.min(_shareIdx + n, total);
  if (n > 1) return _shareIdx===0 && end===total ? `全${total}件` : `${_shareIdx+1}〜${end}件目`;
  return `${_shareIdx+1}/${total}件目`;
}

// 動画は1本ずつ、画像は_shareBatchに従ってまとめる
function nextBatchSize(){
  if (_shareBatch === 1) return 1;
  if (isVideo(_shareQueue[_shareIdx])) return 1;
  let n = 0;
  for (let i=_shareIdx; i<_shareQueue.length && !isVideo(_shareQueue[i]); i++) n++;
  return n;
}

async function prepareBatch(){
  const prog = document.getElementById('zipProg');
  const size  = nextBatchSize();
  const batch = _shareQueue.slice(_shareIdx, _shareIdx + size);
  prog.classList.add('show');
  let files = [];
  for (let i=0; i<batch.length; i++){
    prog.textContent = `準備中 ${i+1}/${batch.length}…`;
    files.push(await fetchAsFile(batch[i], _shareIdx+i));
  }
  prog.classList.remove('show');
  // 端末がまとめてシェアできない場合は半分に減らして再試行
  while (files.length > 1 && !navigator.canShare({files})) {
    files = files.slice(0, Math.ceil(files.length/2));
  }
  if (files.length === 1 && !navigator.canShare({files})) throw new Error('canShare=false');
  _prepared = files;
}

function showShareBtn(text){
  const b = document.getElementById('nextShareBtn');
  b.textContent = text;
  b.classList.add('show');
}
function hideShareBtn(){ document.getElementById('nextShareBtn').classList.remove('show'); }

function finishShare(){
  hideShareBtn();
  document.getElementById('zipProg').classList.remove('show');
  if (_shareBtn){ _shareBtn.disabled = false; _shareBtn = null; }
  _shareQueue = []; _shareIdx = 0; _prepared = null;
}

// nextShareBtnのonclick。準備済みファイルをタップ直後に即シェアする
function shareNext(){
  if (!_prepared || !_prepared.length) return;
  hideShareBtn();
  const files = _prepared;
  navigator.share({files, title:'お写真'})
    .then(()=>advanceShare(true))
    .catch(e=>{
      if (e.name === 'AbortError') { advanceShare(false); }
      else if (e.name === 'NotAllowedError') { showShareBtn(`📲 タップして保存${shareLabel(files.length)?`（${shareLabel(files.length)}）`:''}`); }
      else { showToast('エラーが発生しました'); finishShare(); console.error(e); }
    });
}

async function advanceShare(shared){
  _shareIdx += _prepared.length;
  _prepared = null;
  if (_shareIdx >= _shareQueue.length){
    if (shared) showToast(_shareQueue.length===1 ? '保存しました' : 'すべて保存しました');
    finishShare();
    return;
  }
  try {
    await prepareBatch();
    showShareBtn(`次を保存（${shareLabel(_prepared.length)}）`);
  } catch(e){
    showToast('読み込みエラーが発生しました');
    finishShare();
    console.error(e);
  }
}

// iOS保存フローの入口
async function startShareFlow(items, batchSize, btn){
  _shareQueue = items; _shareIdx = 0; _shareBatch = batchSize; _shareBtn = btn;
  try {
    await prepareBatch();
    // タップ扱いが残っていれば即シェアシートが開く。
    // 切れていればNotAllowedError→「タップして保存」ボタンが出る。
    shareNext();
  } catch(e){
    showToast('読み込みエラーが発生しました');
    finishShare();
    console.error(e);
  }
}

// ─── Save selected ────────────────────────────────────────────
async function saveSelected() {
  if (!_selected.size) return;
  const indices = [..._selected].sort((a,b)=>a-b);
  const photos  = indices.map(i => _photos[i]);
  const prog    = document.getElementById('zipProg');
  const btn     = document.getElementById('saveSelBtn');
  btn.disabled  = true;
  prog.classList.add('show');

  try {
    // iOSはWeb Share APIで保存（圧縮=まとめて／フル画質=1件ずつ）
    if (isIOS && navigator.canShare) {
      prog.classList.remove('show');
      await startShareFlow(photos, _quality==='original' ? 1 : photos.length, btn);
      return;
    }

    // PC / Android → ZIP
    if (typeof JSZip === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip    = new JSZip();
    const folder = zip.folder('photos');
    for (let i=0; i<photos.length; i++) {
      prog.textContent = `準備中 ${i+1}/${photos.length}…`;
      const res  = await fetch(photos[i].publicUrl);
      const blob = await res.blob();
      folder.file(defaultName(photos[i], i), blob);
    }
    prog.textContent = 'ZIP作成中…';
    const blob = await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:1}});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=`photos_${photos.length}枚.zip`; a.click();
    URL.revokeObjectURL(url);
    showToast(`${photos.length}枚のZIPダウンロードを開始しました！`);
  } catch(e) {
    if (e.name !== 'AbortError') showToast('エラーが発生しました。個別で保存をお試しください。');
    console.error(e);
  } finally {
    if (!isIOS) { btn.disabled = false; prog.classList.remove('show'); }
  }
}

// ─── Lightbox ─────────────────────────────────────────────────
function openLB(i){ lbIdx=i; updateLB(); document.getElementById('lightbox').classList.add('open'); document.body.style.overflow='hidden'; }
function closeLB(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
  const v=document.getElementById('lbVideo');
  v.pause(); v.removeAttribute('src'); v.load();
}
function updateLB(){
  const p=_photos[lbIdx]; if(!p)return;
  const img=document.getElementById('lbImg');
  const vid=document.getElementById('lbVideo');
  if (isVideo(p)) {
    img.style.display='none'; img.removeAttribute('src');
    vid.style.display=''; vid.src=p.publicUrl;
  } else {
    vid.pause(); vid.removeAttribute('src'); vid.load();
    vid.style.display='none';
    img.style.display='';
    // 原寸ギャラリーは中間サイズ(1600px)を表示。無ければ原寸へフォールバック
    delete img.dataset.fellback;
    img.dataset.full = p.publicUrl;
    img.src = (_quality === 'original' && p.webUrl) ? p.webUrl : p.publicUrl;
  }
  document.getElementById('lbCounter').textContent = `${lbIdx+1} / ${_photos.length}`;
  document.getElementById('lbName').textContent    = p.file_name||'';
  document.getElementById('iosHint').style.display = isIOS?'block':'none';
}
function lbMove(d){ lbIdx=(lbIdx+d+_photos.length)%_photos.length; updateLB(); }

// ─── Smart Download (1枚) ─────────────────────────────────────
async function smartDownload(i) {
  const p = _photos[i]; if(!p)return;
  if (navigator.canShare) {
    try {
      showToast(isVideo(p)?'動画を準備中…':'写真を準備中…');
      const file = await fetchAsFile(p, i);
      if (navigator.canShare({files:[file]})) {
        try {
          await navigator.share({files:[file], title: file.name});
        } catch(e) {
          if (e.name==='AbortError') return;
          if (e.name==='NotAllowedError') {
            // 読み込みに時間がかかりタップ扱いが切れた → もう一度タップで即シェア
            _shareQueue=[p]; _shareIdx=0; _shareBatch=1; _shareBtn=null; _prepared=[file];
            showShareBtn('📲 タップして保存');
            return;
          }
          throw e;
        }
        return;
      }
    } catch(e) {
      if (e.name==='AbortError') return;
      console.error(e);
    }
  }
  const a = document.createElement('a');
  a.href=p.publicUrl; a.download=defaultName(p,i); a.target='_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast(isIOS?'長押しして「写真に追加」を選択してください':'ダウンロードを開始しました');
}

// ─── Download All ─────────────────────────────────────────────
// iOS: Web Share API で写真アプリに直接保存
// PC/Android: ZIP ダウンロード
async function downloadAll() {
  if (!_photos.length) return;
  const btn  = document.getElementById('dlAllBtn');
  const prog = document.getElementById('zipProg');
  btn.disabled = true;
  prog.classList.add('show');
  try {
    // ── iOS: Web Share API（圧縮=まとめて／フル画質=1件ずつ） ──
    if (isIOS && navigator.canShare) {
      prog.classList.remove('show');
      await startShareFlow(_photos, _quality==='original' ? 1 : _photos.length, btn);
      return;
    }

    // ── PC / Android: ZIP ──
    if (typeof JSZip === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip    = new JSZip();
    const folder = zip.folder('photos');
    for (let i=0;i<_photos.length;i++) {
      prog.textContent = `準備中 ${i+1}/${_photos.length}…`;
      const res  = await fetch(_photos[i].publicUrl);
      const blob = await res.blob();
      folder.file(defaultName(_photos[i], i), blob);
    }
    prog.textContent = 'ZIP作成中…';
    const blob = await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:1}});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download='photos.zip'; a.click();
    URL.revokeObjectURL(url);
    showToast('ZIPダウンロードを開始しました！');
  } catch(e) {
    if (e.name !== 'AbortError') showToast('エラーが発生しました。「選択して保存」をお試しください。');
    console.error(e);
  } finally {
    if (!isIOS) { btn.disabled=false; prog.classList.remove('show'); }
  }
}

function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}

document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowLeft') lbMove(-1);
  if(e.key==='ArrowRight')lbMove(1);
  if(e.key==='Escape')    closeLB();
});
document.getElementById('lightbox').addEventListener('click',e=>{ if(e.target===document.getElementById('lightbox'))closeLB(); });

let _tt;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),3500); }

init();
</script>
