<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ご予約｜mate wo mate</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="ご予約｜mate wo mate">
<meta property="og:description" content="犬の写真スタジオ mate wo mate の撮影会のご予約ページです。">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1C7A78; --accent-d:#155e5c; --accent-s:#e3f0ef;
  --orange:#F39200; --orange-s:#fdeed8;
  --cream:#f8f4ee; --paper:#fff; --ink:#262626; --mute:#6b6b6b; --line:#e4ddd2; --err:#c0392b;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.75;font-size:15px}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
.serif{font-family:"Noto Serif JP",serif}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.top .logo{height:34px;width:auto}
.top .partner{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
.top .partner img{height:28px;width:auto}

.hero{position:relative;background:#ddd}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover}
.hero-txt{padding:18px 16px 4px}
.kicker{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--orange);border-radius:6px;padding:2px 10px;letter-spacing:.04em}
h1{font-size:24px;line-height:1.45;margin-top:10px}
.sub{color:var(--mute);font-size:14px;margin-top:4px}

.facts{margin:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.facts div{display:grid;grid-template-columns:4.2em 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--mute);font-size:12px;padding-top:2px}
.facts dd b{font-size:16px}
.facts small{display:block;color:var(--mute);font-size:12px}
.facts a{color:var(--accent)}

.block{margin:20px 16px}
.block h2{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.block h2::before{content:"";width:4px;height:18px;background:var(--accent);border-radius:2px}
.text p+p{margin-top:8px}
.perks{background:var(--orange-s);border-radius:var(--r);padding:12px 16px;margin:20px 16px}
.perks b{color:#a85f00;font-size:13px}
.perks li{list-style:none;font-size:14px;padding-left:1.1em;text-indent:-1.1em}
.perks li::before{content:"★ ";color:var(--orange)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:20px 16px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.photos.n1{grid-template-columns:1fr}.photos.n2{grid-template-columns:1fr 1fr}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin:20px 16px;padding:18px 16px}
.card h2{font-size:19px;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--mute)}
.days{display:flex;gap:8px;overflow-x:auto;margin:14px -4px 4px;padding:2px 4px 6px}
.day{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;line-height:1.4}
.day small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.day[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.day[aria-selected="true"] small{color:#d6ecea}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slot{border:1.5px solid var(--accent);background:var(--paper);color:var(--accent-d);border-radius:10px;padding:9px 4px 7px;font-weight:700;font-size:15px;cursor:pointer;line-height:1.3;text-align:center}
.slot small{display:block;font-size:11px;font-weight:500}
.slot.few small{color:#b06a00}
.slot[disabled]{border-color:var(--line);color:#b7b0a6;background:#f4f1ec;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);color:#fff}
.slot[aria-pressed="true"] small{color:#d6ecea}
.legend{font-size:12px;color:var(--mute);margin-top:10px}
.empty{padding:14px;border-radius:10px;background:var(--cream);font-size:14px;text-align:center;margin-top:12px}

.picked{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-s);border-radius:10px;padding:10px 12px;margin:10px 0 6px}
.picked b{font-size:16px;color:var(--accent-d)}
.picked button{border:0;background:none;color:var(--accent);font-size:13px;text-decoration:underline;cursor:pointer;white-space:nowrap}
.field{margin-top:14px}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:4px}
.req{font-size:10.5px;color:#fff;background:var(--orange);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;font-weight:700}
.opt{font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:500}
.field input[type=text],.field input[type=email],.field input[type=tel],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field .help{font-size:12px;color:var(--mute);margin-top:3px}
.field.bad input,.field.bad textarea{border-color:var(--err)}
.field .msg{display:none;color:var(--err);font-size:12.5px;margin-top:3px}
.field.bad .msg{display:block}
.adddog{margin-top:8px;border:1.5px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;width:100%}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.check.bad span{color:var(--err)}
.notes{background:var(--cream);border-radius:10px;padding:12px 14px;margin-top:18px}
.notes b{font-size:13.5px}
.notes li{list-style:none;font-size:13.5px;padding-left:1em;text-indent:-1em;margin-top:3px}
.notes li::before{content:"・"}
.submit{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;background:var(--orange);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #c97800}
.submit[disabled]{opacity:.6;cursor:wait}
.formerr{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#fbecea;color:var(--err);font-size:13.5px}
.formerr.show{display:block}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:none;z-index:10}
.bar.show{display:block}
.bar a{display:block;max-width:528px;margin:0 auto;text-align:center;background:var(--orange);color:#fff;font-weight:700;border-radius:12px;padding:12px;text-decoration:none}

.state{margin:40px 16px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px 18px}
.state h2{font-size:20px;margin-bottom:8px}
.state p{font-size:14px;color:#444}
.done{border-top:6px solid var(--accent)}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:56px;margin:0 auto 10px}
.summary{text-align:left;background:var(--cream);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:14px}
.summary div{display:grid;grid-template-columns:5em 1fr;gap:6px;padding:3px 0}
.summary span{color:var(--mute);font-size:12.5px}
.btn2{display:inline-block;margin-top:6px;border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.btn-danger{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;padding:13px;background:#8e8e8e;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.skel{height:220px;background:linear-gradient(90deg,#eee 0,#f6f6f6 50%,#eee 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
footer{text-align:center;font-size:11.5px;color:var(--mute);padding:28px 16px 110px}
footer a{color:var(--mute)}
.radios{display:flex;gap:8px}
.radios label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-weight:500;font-size:15px;cursor:pointer;margin:0}
.radios input{accent-color:var(--accent);width:18px;height:18px}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-s)}
.field.bad .radios label{border-color:var(--err)}
.list-head{padding:22px 16px 4px}
.list-head h1{font-size:22px;margin-top:0}
.ev{display:block;margin:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit}
.ev img{width:100%;aspect-ratio:16/9;object-fit:cover}
.ev .b{padding:12px 14px 14px}
.ev h2{font-size:17px;line-height:1.5}
.ev p{font-size:13px;color:var(--mute)}
.ev .go{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#fff;background:var(--orange);border-radius:8px;padding:4px 12px}
.ev .go.off{background:#aaa}
.demo{background:#fff6d6;color:#7a5b00;font-size:12px;text-align:center;padding:6px}
@media (min-width:600px){
  body{font-size:15.5px}
  .wrap{margin-top:24px;margin-bottom:24px;background:var(--cream);border-radius:18px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.06)}
  .slots{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="demo" class="demo" hidden>見本表示です（実際の予約にはなりません）</div>
  <header class="top">
    <img class="logo" src="img/logo.png" alt="mate wo mate">
    <div class="partner" id="partner"></div>
  </header>
  <main id="app"><div class="skel"></div></main>
  <footer>犬の写真スタジオ mate wo mate（マテヲマテ）<br>静岡市駿河区丸子 1HOTEL内 ／ <a href="mailto:info@wansna.com">info@wansna.com</a></footer>
</div>
<div class="bar" id="bar"><a href="#book">空いている時間を見る</a></div>

<script>
/* ===== 設定：GASのウェブアプリURL（デプロイ後に貼る） ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxtEU6zIu0g2NHjjPbQAI6ZeYiGwGcMI1wxBlSjCVD3cC3t_ZrE1EnUAh7KSfhz0Br5/exec';

/* ===================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines = s => String(s || '').split(/\r?\n/).map(x => x.replace(/^[・\-\s]+/, '').trim()).filter(Boolean);
const params = new URLSearchParams(location.search);
const DEMO = !API_URL || params.has('demo');
const W = '日月火水木金土';
function dateJa(d, withYear) {
  const [y, m, dd] = d.split('-').map(Number);
  const wd = W[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()];
  return (withYear ? y + '年' : '') + m + '月' + dd + '日（' + wd + '）';
}
const state = { data: null, day: null, slot: null, dogs: 1 };

/* ---------- API ---------- */
async function api(method, payload) {
  if (DEMO) return demoApi(method, payload);
  if (method === 'GET') {
    const q = new URLSearchParams(payload).toString();
    const r = await fetch(API_URL + '?' + q, { cache: 'no-store' });
    return r.json();
  }
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }); // text/plain で送る（事前確認なし）
  return r.json();
}

/* ---------- 見本データ（API_URL が空、または ?demo のとき） ---------- */
const demoBooked = { '2027-01-24 10:00': 1, '2027-01-24 10:20': 1, '2027-01-24 13:20': 1, '2027-01-24 15:00': 1 };
function demoApi(method, p) {
  const slots = [];
  for (let t = 600; t + 20 <= 960; t += 20) {
    if (t < 760 && t + 20 > 720) continue;
    const f = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    slots.push({ start: f(t), end: f(t + 20) });
  }
  const mk = d => ({ date: d, slots: slots.map(s => ({ ...s, remain: demoBooked[d + ' ' + s.start] ? 0 : 1, closed: false })) });
  if (method === 'GET' && p.action === 'list') return Promise.resolve({ ok: true, events: [{ id: 'demo', title: 'ワーゲンバス撮影会', dates: ['2027-01-24'], start: '10:00', end: '16:00', venue: '1HOTEL', price: '10,000円（税込）', hero: 'img/demo_TAR09810.jpg', status: 'open', free: 12 }] });
  if (method === 'GET' && p.action === 'event') {
    return Promise.resolve({ ok: true, status: 'open', event: {
      id: 'demo', title: 'ワーゲンバス撮影会', subtitle: '1組ずつ貸切で撮る、1日だけの撮影会',
      dates: ['2027-01-24'], start: '10:00', end: '16:00', slotMin: 20, cap: 1, maxDogs: 2, deadline: '前日20:00',
      price: '10,000円（税込）', priceNote: '撮影20分／30〜50枚からお好きなデータを10カット',
      venue: '1HOTEL', address: '静岡市駿河区丸子3344-11', mapUrl: '',
      lead: 'ワーゲンバスの前で、1組ずつ貸切で撮る撮影会です。\n遊んでいるところを撮るから、「うちの子」らしい写真になります。撮影中は、ずっと自由に遊ばせてください。「まて」をがんばらなくても大丈夫です。',
      perks: '1HOTELご宿泊の方：＋5カット＆優先予約枠', notes: '混合ワクチンと狂犬病予防接種を済ませている子が対象です（証明書の提示は不要です）。\nヒート中の子はご遠慮いただいています。\n雨天中止です。前日の12時までにご連絡します（参加費はいただきません）。',
      hero: 'img/demo_TAR09810.jpg', photos: ['img/demo_TAR09864.jpg', 'img/demo_TAR09833.jpg', 'img/demo_TAR09871.jpg'],
      partnerLogo: '', partnerName: '', askStay: true, extraQ: '', color: '', lineUrl: 'https://lin.ee/' },
      days: [mk('2027-01-24')] });
  }
  if (method === 'POST' && p.action === 'book') {
    const k = p.date + ' ' + p.start;
    if (demoBooked[k]) return Promise.resolve({ ok: false, code: 'full' });
    demoBooked[k] = 1;
    const s = slots.find(x => x.start === p.start);
    return new Promise(r => setTimeout(() => r({ ok: true, bookingId: '1015-DEMO', date: p.date, start: p.start, end: s.end }), 600));
  }
  if (method === 'GET' && p.action === 'booking') return Promise.resolve({ ok: true, booking: { bookingId: '1015-DEMO', eventTitle: 'ワーゲンバス撮影会', date: '2027-01-24', start: '10:40', end: '11:00', name: '見本 花子', dogs: ['こむぎ（トイプードル）'], status: '予約', venue: '1HOTEL', canCancel: true } });
  if (method === 'POST' && p.action === 'cancel') return Promise.resolve({ ok: true });
  return Promise.resolve({ ok: false, code: 'notfound' });
}

/* ---------- 画面 ---------- */
function showState(title, html, cls = '') {
  $('#app').innerHTML = `<section class="state ${cls}"><h2 class="serif">${title}</h2>${html}</section>`;
  $('#bar').classList.remove('show');
  window.scrollTo(0, 0);
}

async function load() {
  if (DEMO) $('#demo').hidden = false;
  const cancelToken = params.get('cancel');
  if (cancelToken) return loadCancel(cancelToken);
  let id = params.get('e');
  if (!id) {
    // 一覧：受付中のイベントが1つならそのまま表示、2つ以上なら一覧
    let ls;
    try { ls = await api('GET', { action: 'list' }); }
    catch (e) { return showState('読み込めませんでした', '<p>通信状況をご確認のうえ、ページを再読み込みしてください。</p>'); }
    const evs = (ls && ls.events) || [];
    if (evs.length === 1) id = evs[0].id;
    else return renderList(evs);
  }
  let res;
  try { res = await api('GET', { action: 'event', id }); }
  catch (e) { return showState('読み込めませんでした', '<p>通信状況をご確認のうえ、ページを再読み込みしてください。</p>'); }
  if (!res.ok) return showState('このイベントは公開されていません', '<p>URLをご確認いただくか、公式LINEからお問い合わせください。</p>');
  state.data = res;
  render();
}

function renderList(evs) {
  if (!evs.length) return showState('いま受付中の撮影会はありません', '<p>次回のお知らせは、Instagramと公式LINEでお届けします。</p>');
  document.title = '撮影会のご予約｜mate wo mate';
  const card = e => {
    const when = e.dates.length === 1 ? dateJa(e.dates[0]) : dateJa(e.dates[0]) + '〜' + dateJa(e.dates[e.dates.length - 1]);
    const lab = e.status === 'before' ? ['受付前', true] : e.status === 'full' ? ['満席', true] : ['空き ' + e.free + '枠・予約する', false];
    return `<a class="ev" href="?e=${encodeURIComponent(e.id)}">${e.hero ? `<img src="${esc(e.hero)}" alt="" loading="lazy">` : ''}
      <div class="b"><h2 class="serif">${esc(e.title)}</h2><p>${esc(when)} ${esc(e.start)}〜${esc(e.end)}${e.venue ? '｜' + esc(e.venue) : ''}${e.price ? '｜' + esc(e.price) : ''}</p>
      <span class="go${lab[1] ? ' off' : ''}">${lab[0]}</span></div></a>`;
  };
  $('#app').innerHTML = `<div class="list-head"><h1 class="serif">撮影会のご予約</h1><p class="sub">ご希望の撮影会を選んでください</p></div>${evs.map(card).join('')}`;
}

function render() {
  const { event: ev, days, status } = state.data;
  if (ev.color) document.documentElement.style.setProperty('--accent', ev.color);
  document.title = ev.title + '｜ご予約｜mate wo mate';
  $('#partner').innerHTML = (ev.partnerName ? `<span>${esc(ev.partnerName)}</span>` : '') + (ev.partnerLogo ? `<img src="${esc(ev.partnerLogo)}" alt="">` : '');

  const dateLine = ev.dates.map(d => dateJa(d)).join('・');
  const time = ev.start + '〜' + ev.end;
  const kicker = ev.dates.length === 1 ? dateJa(ev.dates[0]) + ' 開催' : ev.dates.length + '日間 開催';
  const photos = (ev.photos || []).filter(Boolean);
  const perks = lines(ev.perks), notes = lines(ev.notes);

  $('#app').innerHTML = `
    <section class="hero">${ev.hero ? `<img src="${esc(ev.hero)}" alt="">` : ''}</section>
    <div class="hero-txt"><span class="kicker">${esc(kicker)}</span><h1 class="serif">${esc(ev.title)}</h1>${ev.subtitle ? `<p class="sub">${esc(ev.subtitle)}</p>` : ''}</div>
    <dl class="facts">
      <div><dt>日時</dt><dd><b>${esc(dateLine)}</b><small>${esc(time)}（1組${ev.slotMin}分・ご予約制）</small></dd></div>
      ${ev.venue ? `<div><dt>会場</dt><dd>${esc(ev.venue)}${ev.address ? `<small>${esc(ev.address)}${ev.mapUrl ? ` ／ <a href="${esc(ev.mapUrl)}" target="_blank" rel="noopener">地図</a>` : ''}</small>` : ''}</dd></div>` : ''}
      ${ev.price ? `<div><dt>料金</dt><dd><b>${esc(ev.price)}</b>${ev.priceNote ? `<small>${esc(ev.priceNote)}</small>` : ''}</dd></div>` : ''}
    </dl>
    ${ev.lead ? `<div class="block text">${lines(ev.lead).map(l => `<p>${esc(l)}</p>`).join('')}</div>` : ''}
    ${photos.length ? `<div class="photos n${photos.length}">${photos.map(p => `<img src="${esc(p)}" alt="" loading="lazy">`).join('')}</div>` : ''}
    ${perks.length ? `<div class="perks"><b>特典</b><ul>${perks.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    <section class="card" id="book">
      <h2 class="serif">ご予約</h2>
      <p class="hint">ご希望の時間を選んでください。${ev.deadline ? '受付は' + esc(deadlineText(ev.deadline)) + 'までです。' : ''}</p>
      <div id="bookBody"></div>
    </section>
    <section class="card" id="formSec" hidden></section>`;

  const bb = $('#bookBody');
  if (status === 'before') {
    const of = state.data.openFrom ? new Date(state.data.openFrom) : null;
    bb.innerHTML = `<div class="empty">ご予約の受付は${of ? of.toLocaleString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' }) + 'から' : 'まもなく'}はじまります。</div>`;
  } else if (status === 'closed') {
    bb.innerHTML = `<div class="empty">ご予約の受付は終了しました。<br>当日の空き枠は、会場でご案内します。</div>`;
  } else {
    if (!state.day || !days.find(d => d.date === state.day)) {
      const firstFree = days.find(d => d.slots.some(s => !s.closed && s.remain > 0));
      state.day = (firstFree || days[0]).date;
    }
    renderDays();
  }
  $('#bar').classList.toggle('show', status === 'open' || status === 'full');
  setupBarObserver();
  window.__notes = notes;
}

function deadlineText(d) {
  const m = String(d).match(/前日\s*(\d{1,2})[:：](\d{2})/);
  if (m) return '前日の' + Number(m[1]) + ':' + m[2];
  const h = Number(String(d).replace(/[^\d.]/g, ''));
  return h ? '各回の' + h + '時間前' : '開始時刻';
}

function renderDays() {
  const { days } = state.data;
  const bb = $('#bookBody');
  const tabs = days.length > 1 ? `<div class="days" role="tablist">${days.map(d => {
    const free = d.slots.filter(s => !s.closed && s.remain > 0).length;
    return `<button class="day" role="tab" aria-selected="${d.date === state.day}" data-day="${d.date}">${esc(dateJa(d.date))}<small>${free ? '空き ' + free + '枠' : '満席'}</small></button>`;
  }).join('')}</div>` : '';
  const day = days.find(d => d.date === state.day);
  const btns = day.slots.map(s => {
    const off = s.closed || s.remain <= 0;
    const lab = s.closed ? '受付終了' : s.remain <= 0 ? '満席' : slotCap() > 1 && s.remain === 1 ? '残り1組' : '空きあり';
    const few = !off && slotCap() > 1 && s.remain === 1;
    const pressed = state.slot && state.slot.date === day.date && state.slot.start === s.start;
    return `<button class="slot${few ? ' few' : ''}" data-start="${s.start}" ${off ? 'disabled' : ''} aria-pressed="${!!pressed}">${s.start}<small>${lab}</small></button>`;
  }).join('');
  const anyFree = day.slots.some(s => !s.closed && s.remain > 0);
  bb.innerHTML = `${tabs}
    ${days.length === 1 ? `<p style="margin-top:12px;font-weight:700">${esc(dateJa(day.date, true))}</p>` : ''}
    <div class="slots">${btns}</div>
    ${anyFree ? '' : '<div class="empty">この日は満席になりました。キャンセルが出ると、ここに空き枠が表示されます。</div>'}`;
  bb.querySelectorAll('.day').forEach(b => b.onclick = () => { state.day = b.dataset.day; renderDays(); });
  bb.querySelectorAll('.slot:not([disabled])').forEach(b => b.onclick = () => pickSlot(day.date, b.dataset.start));
}
function slotCap() { return Number(state.data.event.cap) || 1; }

function pickSlot(date, start) {
  const day = state.data.days.find(d => d.date === date);
  const s = day.slots.find(x => x.start === start);
  state.slot = { date, start, end: s.end };
  renderDays();
  renderForm();
  const f = $('#formSec');
  setTimeout(() => f.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

function renderForm() {
  const ev = state.data.event;
  const f = $('#formSec');
  const keep = collect(true);
  f.hidden = false;
  const dogFields = Array.from({ length: state.dogs }, (_, i) => `
    <div class="field" data-f="dog${i}"><label>${i === 0 ? 'わんちゃんのお名前と犬種<span class="req">必須</span>' : (i + 1) + '頭目のお名前と犬種<span class="opt">任意</span>'}</label>
      <input type="text" name="dog${i}" placeholder="例：こむぎ（トイプードル）" autocomplete="off"><p class="msg">わんちゃんのお名前と犬種を入れてください</p></div>`).join('');
  const notes = window.__notes || [];
  f.innerHTML = `
    <h2 class="serif">ご予約の内容</h2>
    <div class="picked"><b>${esc(dateJa(state.slot.date))} ${state.slot.start}〜${state.slot.end}</b><button type="button" id="change">時間を変える</button></div>
    <form id="form" novalidate>
      <div class="hp" aria-hidden="true"><label>website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="field" data-f="name"><label>お名前<span class="req">必須</span></label><input type="text" name="name" autocomplete="name" placeholder="例：山田 花子"><p class="msg">お名前を入れてください</p></div>
      <div class="field" data-f="email"><label>メールアドレス<span class="req">必須</span></label><input type="email" name="email" autocomplete="email" inputmode="email" placeholder="例：hanako@example.com"><p class="help">確認メールと前日のお知らせをお送りします</p><p class="msg">メールアドレスをご確認ください</p></div>
      <div class="field" data-f="tel"><label>電話番号<span class="req">必須</span></label><input type="tel" name="tel" autocomplete="tel" inputmode="tel" placeholder="例：090-1234-5678"><p class="help">当日の雨天のご連絡などに使います</p><p class="msg">電話番号をご確認ください</p></div>
      ${dogFields}
      ${state.dogs < ev.maxDogs ? `<button type="button" class="adddog" id="adddog">＋ ${state.dogs + 1}頭目を追加する（${ev.maxDogs}頭まで）</button>` : ''}
      ${ev.askStay ? `<div class="field" data-f="stay"><label>1HOTELにご宿泊ですか<span class="req">必須</span></label><div class="radios"><label><input type="radio" name="stay" value="はい">はい</label><label><input type="radio" name="stay" value="いいえ">いいえ</label></div><p class="msg">どちらかを選んでください</p></div>` : ''}
      ${ev.extraQ ? `<div class="field"><label>${esc(ev.extraQ)}<span class="opt">任意</span></label><input type="text" name="extra"></div>` : ''}
      <div class="field"><label>ご要望・気になること<span class="opt">任意</span></label><textarea name="memo" placeholder="例：音に驚きやすい子です"></textarea></div>
      <label class="check" data-f="vaccine"><input type="checkbox" name="vaccine"><span>混合ワクチンと狂犬病予防接種を済ませています</span></label>
      ${notes.length ? `<div class="notes"><b>ご注意</b><ul>${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}
      <label class="check" data-f="agree"><input type="checkbox" name="agree"><span>${notes.length ? '「ご注意」を確認しました' : '内容を確認しました'}</span></label>
      <div class="formerr" id="formerr"></div>
      <button class="submit" id="submit" type="submit">この内容で予約する</button>
    </form>`;
  restore(keep);
  $('#change').onclick = () => $('#book').scrollIntoView({ behavior: 'smooth' });
  const add = $('#adddog'); if (add) add.onclick = () => { state.dogs++; renderForm(); };
  $('#form').onsubmit = submit;
  f.querySelectorAll('input,textarea').forEach(i => i.addEventListener(i.type === 'radio' ? 'change' : 'input', () => i.closest('.field,.check')?.classList.remove('bad')));
}

function collect(raw) {
  const form = $('#form'); if (!form) return null;
  const v = {};
  form.querySelectorAll('input,textarea').forEach(i => {
    if (i.type === 'radio') { if (!(i.name in v)) v[i.name] = ''; if (i.checked) v[i.name] = i.value; return; }
    v[i.name] = i.type === 'checkbox' ? i.checked : i.value;
  });
  return v;
}
function restore(v) {
  if (!v) return;
  const form = $('#form');
  Object.entries(v).forEach(([k, val]) => { const i = form.elements[k]; if (!i) return; if (i.type === 'checkbox') i.checked = val; else i.value = val; });
}

async function submit(e) {
  e.preventDefault();
  const ev = state.data.event;
  const v = collect();
  const bad = [];
  if (!v.name.trim()) bad.push('name');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) bad.push('email');
  if (v.tel.replace(/[^\d]/g, '').length < 10) bad.push('tel');
  if (!v.dog0.trim()) bad.push('dog0');
  if (!v.vaccine) bad.push('vaccine');
  if (!v.agree) bad.push('agree');
  if (ev.askStay && !v.stay) bad.push('stay');
  document.querySelectorAll('[data-f]').forEach(el => el.classList.toggle('bad', bad.includes(el.dataset.f)));
  const fe = $('#formerr');
  if (bad.length) {
    fe.textContent = '入力していない項目があります。赤い部分をご確認ください。';
    fe.classList.add('show');
    document.querySelector('[data-f].bad')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  fe.classList.remove('show');
  const btn = $('#submit'); btn.disabled = true; btn.textContent = '送信しています…';
  const dogs = Array.from({ length: state.dogs }, (_, i) => (v['dog' + i] || '').trim()).filter(Boolean);
  let res;
  try {
    res = await api('POST', { action: 'book', id: ev.id, date: state.slot.date, start: state.slot.start,
      name: v.name.trim(), email: v.email.trim(), tel: v.tel.trim(), dogs, vaccine: !!v.vaccine, agree: !!v.agree,
      stay: v.stay || '', extra: v.extra || '', memo: v.memo || '', website: v.website || '' });
  } catch (err) { res = { ok: false, code: 'network' }; }
  if (res.ok) return done(res, v, dogs);
  btn.disabled = false; btn.textContent = 'この内容で予約する';
  const msg = {
    full: 'タッチの差で、この時間は埋まってしまいました。ほかの時間をお選びください。',
    closed: 'この時間の受付は終了しました。ほかの時間をお選びください。',
    dup: 'この時間は、同じメールアドレスですでにご予約いただいています。',
    invalid: '入力内容をご確認ください。', busy: '混み合っています。少し待ってからもう一度お試しください。',
    network: '通信できませんでした。電波の良いところでもう一度お試しください。',
  }[res.code] || 'ご予約できませんでした。お手数ですが、公式LINEからお問い合わせください。';
  fe.textContent = msg; fe.classList.add('show');
  if (res.code === 'full' || res.code === 'closed') {
    try { const r = await api('GET', { action: 'event', id: ev.id }); if (r.ok) { state.data = r; state.slot = null; renderDays(); $('#formSec').hidden = true; } } catch (_) {}
    $('#book').scrollIntoView({ behavior: 'smooth' });
    alertBox(msg);
  }
}
function alertBox(msg) {
  const bb = $('#bookBody');
  const d = document.createElement('div'); d.className = 'formerr show'; d.textContent = msg;
  bb.prepend(d);
}

function gcalLink(ev, r) {
  const z = (d, t) => { const x = new Date(d + 'T' + t + ':00+09:00'); return x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
  const q = new URLSearchParams({ action: 'TEMPLATE', text: ev.title + '（mate wo mate）', dates: z(r.date, r.start) + '/' + z(r.date, r.end),
    location: [ev.venue, ev.address].filter(Boolean).join(' '), details: '予約ID：' + r.bookingId });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}

function done(r, v, dogs) {
  const ev = state.data.event;
  showState('ご予約ありがとうございます', `
    <div class="summary">
      <div><span>日時</span><b>${esc(dateJa(r.date, true))} ${r.start}〜${r.end}</b></div>
      ${ev.venue ? `<div><span>会場</span>${esc(ev.venue)}</div>` : ''}
      <div><span>お名前</span>${esc(v.name)} 様</div>
      <div><span>わんちゃん</span>${dogs.map(esc).join('／')}</div>
      <div><span>予約ID</span>${esc(r.bookingId)}</div>
    </div>
    <p>確認メールを <b>${esc(v.email)}</b> にお送りしました。<br>届かない場合は、迷惑メールのフォルダもご確認ください。</p>
    <p style="margin-top:14px"><a class="btn2" href="${gcalLink(ev, r)}" target="_blank" rel="noopener">カレンダーに追加する</a></p>
    ${ev.lineUrl ? `<p style="margin-top:14px;font-size:13px">ご不明な点は<a href="${esc(ev.lineUrl)}" target="_blank" rel="noopener">公式LINE</a>からどうぞ。</p>` : ''}`,
    'done');
  $('.state').insertAdjacentHTML('afterbegin', '<div class="ok">✓</div>');
}

/* ---------- キャンセル ---------- */
async function loadCancel(token) {
  let r;
  try { r = await api('GET', { action: 'booking', token }); } catch (_) { r = { ok: false }; }
  if (!r.ok) return showState('ご予約が見つかりません', '<p>メールのリンクをもう一度お試しいただくか、公式LINEからお問い合わせください。</p>');
  const b = r.booking;
  const sum = `<div class="summary">
      <div><span>イベント</span>${esc(b.eventTitle)}</div>
      <div><span>日時</span><b>${esc(dateJa(b.date, true))} ${b.start}〜${b.end}</b></div>
      <div><span>お名前</span>${esc(b.name)} 様</div>
      <div><span>わんちゃん</span>${b.dogs.map(esc).join('／')}</div></div>`;
  if (b.status !== '予約') return showState('キャンセル済みです', sum + '<p>このご予約は、すでにキャンセルされています。</p>');
  if (!b.canCancel) return showState('ページからはキャンセルできません', sum + '<p>キャンセルの受付期限を過ぎています。お手数ですが、公式LINEからご連絡ください。</p>');
  showState('ご予約のキャンセル', sum + '<p>このご予約をキャンセルしますか？</p><button class="btn-danger" id="doCancel">キャンセルする</button>');
  $('#doCancel').onclick = async () => {
    const btn = $('#doCancel'); btn.disabled = true; btn.textContent = '処理しています…';
    let x; try { x = await api('POST', { action: 'cancel', token }); } catch (_) { x = { ok: false }; }
    if (x.ok) showState('キャンセルを承りました', sum + '<p>確認のメールをお送りしました。<br>またの機会にお会いできるのを楽しみにしています。</p>');
    else { btn.disabled = false; btn.textContent = 'キャンセルする'; btn.insertAdjacentHTML('afterend', '<div class="formerr show">キャンセルできませんでした。お手数ですが、公式LINEからご連絡ください。</div>'); }
  };
}

/* ---------- 下の「空いている時間を見る」ボタン ---------- */
function setupBarObserver() {
  const book = $('#book'), bar = $('#bar');
  if (!book || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    const past = e.boundingClientRect.top < 0;
    bar.classList.toggle('show', !e.isIntersecting && !past && (state.data.status === 'open'));
  }));
  io.observe(book);
  const fs = $('#formSec');
  if (fs) new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) bar.classList.remove('show'); })).observe(fs);
}

load();
</script>
</body>
</html>
